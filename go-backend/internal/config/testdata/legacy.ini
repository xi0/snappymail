; Legacy application.ini, as an older SnappyMail release wrote it: the keys are
; moved by RainLoop\Config\Application::Set() on load.

[webmail]
title = "My SnappyMail"
language = "DA"
language_admin = "nl"
messages_per_page = "35"
allow_themes = Off

[security]
custom_server_signature = "My \"quoted\" server\\name"
admin_panel_host = "admin.example.com"
admin_panel_key = "manage"
encrypt_cipher = "aes-256-cbc"

[labs]
imap_use_expunge_all_on_delete = On
force_https = On
login_fault_delay = 3
cache_system_data = Off
use_app_debug_js = On
check_new_messages = Off
log_ajax_response_write_limit = 42

[custom]
Foo = "bar"
