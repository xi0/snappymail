<!DOCTYPE html>
<html class="rl-started-trigger">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="google" content="notranslate">
	<meta name="robots" content="noindex,nofollow,noodp">
	<meta name="theme-color" content="black">
	<title></title>
	<script nonce="">
	/* Theme mode (light/dark/system), applied before first paint to avoid a flash. */
	(function () {
		var d = document, root = d.documentElement, KEY = 'smThemeMode',
			mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
		function stored() { try { var v = localStorage.getItem(KEY); return ('light' === v || 'dark' === v) ? v : null; } catch (e) { return null; } }
		function system() { return (mq && mq.matches) ? 'dark' : 'light'; }
		function resolve() { return stored() || system(); }
		function apply() {
			var mode = resolve(), pref = stored() || 'system';
			root.setAttribute('data-theme-mode', mode);
			root.setAttribute('data-theme-pref', pref);
			var meta = d.querySelector('meta[name="theme-color"]');
			meta && meta.setAttribute('content', 'dark' === mode ? '#0b1220' : '#0066cc');
			d.dispatchEvent(new CustomEvent('sm-theme-mode', { detail: mode }));
		}
		function set(mode) {
			try { 'system' === mode ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, mode); } catch (e) {}
			apply();
		}
		window.smThemeMode = {
			get: resolve,
			set: set,
			stored: stored,
			system: system,
			toggle: function () { set('dark' === resolve() ? 'light' : 'dark'); }
		};
		apply();
		try { mq && mq.addEventListener('change', function () { stored() || apply(); }); }
		catch (e) { mq && mq.addListener(function () { stored() || apply(); }); }
		d.addEventListener('click', function (e) {
			var t = e.target && e.target.closest ? e.target.closest('[data-sm-theme-toggle],[data-sm-theme-set]') : null;
			if (!t) { return; }
			e.preventDefault();
			var v = t.getAttribute('data-sm-theme-set');
			v ? set(v) : window.smThemeMode.toggle();
		});
	})();
	</script>
	<style id="app-boot-css">{{BaseAppBootCss}}</style>
	<link type="text/css" rel="stylesheet" href="{{BaseAppMainCssLink}}">
	<link rel="manifest" href="{{BaseAppManifestLink}}">
	<link rel="icon" href="{{BaseFavIconSvg}}" type="image/svg+xml">
	<style id="app-theme-style" data-name="{{BaseAppThemeName}}">{{BaseAppThemeCss}}</style>
	{{BaseAppFaviconPngLinkTag}}
	{{BaseAppFaviconTouchLinkTag}}
</head>
<body id="rl-app" data-admin='{{BaseAppAdmin}}' spellcheck="false">
	<div id="rl-loading">
		<div id="rl-loading-desc">{{LoadingDescriptionEsc}}</div>
		<i class="icon-spinner"></i>
		<noscript><div class="error-desc">{{NO_SCRIPT_DESC}}</div></noscript>
	</div>
	<div id="rl-loading-error" hidden="">An error occurred.<br>Please refresh the page and try again.<br></div>
	<div id="rl-BadBrowser" hidden="">
		<h1>{{BAD_BROWSER_TITLE}}</h1>
		<div class="error-desc">{{BAD_BROWSER_DESC}}</div>
	</div>
	<div id="rl-NoCookie" hidden="">
		<h1>{{NO_COOKIE_TITLE}}</h1>
		<div class="error-desc">{{NO_COOKIE_DESC}}</div>
	</div>
	<div id="rl-content" hidden="">
		<div id="rl-left"></div>
		<div id="rl-right"></div>
	</div>
	<div id="rl-popups"></div>
	{{BaseTemplates}}
	<script nonce="" type="text/javascript">{{BaseAppBootScript}}{{BaseLanguage}}</script>
</body>
</html>
